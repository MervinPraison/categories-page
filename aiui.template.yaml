schemaVersion: 1
site:
  title: Categories Page
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: Display all WordPress categories in a sortable table
seo:
  siteUrl: https://mervinpraison.github.io/categories-page
navigation:
  tabs:
  - tab: Home
    groups:
    - group: Home
      pages:
      - index
  - tab: Getting Started
    groups:
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/usage
      prefix: getting-started
navbar:
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/categories-page
footer:
  socials:
    github: https://github.com/MervinPraison/categories-page
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: Categories Page
  footer_main:
    type: Footer
    props:
      text: Categories Page
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
